<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #f7f1e8 0%, #d9eee9 100%);
        color: #143932;
      }

      .card {
        width: min(100%, 420px);
        padding: 32px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 18px 40px rgba(20, 57, 50, 0.12);
        text-align: center;
      }

      h1 {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are offline</h1>
      <p>Daily Focus is not able to load new content right now.</p>
      <p>Reconnect to the internet and try again.</p>
    </main>
  </body>
  </html>
